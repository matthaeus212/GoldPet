# ============================================================================
# MANNAM Square Nginx Configuration
# mannamsquare.com 도메인 및 서브도메인 통합 설정 파일
# ============================================================================
#
# 도메인 구조:
# - mannamsquare.com, www.mannamsquare.com  → Next.js 공식 웹사이트
# - api.mannamsquare.com                    → GoldPet Backend API (Spring Boot, 포트 8081)
# - app.mannamsquare.com                    → GoldPet Frontend (React SPA)
# - admin.mannamsquare.com                  → 관리자 페이지
# - m.mannamsquare.com                      → 모바일 웹 (정적 HTML)
# - s3.mannamsquare.com                     → MinIO Object Storage (S3 API)
# - jenkins.mannamsquare.com                → Jenkins CI/CD (별도 파일)
# - 만남광장.com (xn--hc0b21etukhno.com)    → www.mannamsquare.com 리다이렉트
# ============================================================================

# ----------------------------------------------------------------------------
# [0] 한글 도메인 리다이렉트
# 만남광장.com → www.mannamsquare.com
# Punycode: xn--hc0b21etukhno.com
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name xn--hc0b21etukhno.com www.xn--hc0b21etukhno.com;

    # Let's Encrypt SSL 인증서 자동 갱신을 위한 경로
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # www.mannamsquare.com으로 리다이렉트
    location / {
        return 301 https://www.mannamsquare.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name xn--hc0b21etukhno.com www.xn--hc0b21etukhno.com;

    # SSL 인증서 설정 (메인 도메인 인증서 공유)
    include /etc/nginx/ssl/ssl-params.conf;

    # www.mannamsquare.com으로 리다이렉트
    return 301 https://www.mannamsquare.com$request_uri;
}

# ----------------------------------------------------------------------------
# [1] 메인 도메인 - HTTP to HTTPS 리다이렉트
# mannamsquare.com, www.mannamsquare.com
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mannamsquare.com www.mannamsquare.com;

    # Let's Encrypt SSL 인증서 자동 갱신을 위한 경로
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------------
# [2] 메인 도메인 - HTTPS (Next.js 공식 웹사이트)
# mannamsquare.com, www.mannamsquare.com
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name mannamsquare.com www.mannamsquare.com;

    # 웹사이트 루트 디렉토리 (Next.js static export)
    root /home/dev/www/mannam/web;
    index index.html;

    # SSL 인증서 설정
    include /etc/nginx/ssl/ssl-params.conf;

    # Next.js static export 지원 (trailingSlash: true)
    # URL 패턴: /about/ → /about/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Next.js 빌드 파일 캐싱 (1년)
    # 파일명에 해시가 포함되므로 (예: main-abc123.js) 코드 변경 시 자동으로 새 파일 다운로드
    # `expires` + `add_header Cache-Control` 동시 사용 시 Cache-Control 헤더가 2개 발사되어
    # 일부 클라이언트/중간 프록시가 첫 헤더만 읽고 `immutable` 을 놓침 → add_header 단일화.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 이미지 파일 캐싱 (30일)
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}

# ----------------------------------------------------------------------------
# [3] 서브도메인 - HTTP to HTTPS 리다이렉트
# api, app, admin, m (모바일), s3 (MinIO Object Storage)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name m.mannamsquare.com admin.mannamsquare.com api.mannamsquare.com app.mannamsquare.com s3.mannamsquare.com minio.mannamsquare.com;

    # Let's Encrypt SSL 인증서 자동 갱신을 위한 경로
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------------
# [4] API 서버 - GoldPet Backend
# api.mannamsquare.com
# ----------------------------------------------------------------------------
# Spring Boot API 서버 (포트 8081)
# Jenkins가 8080 포트를 사용하므로 8081로 설정
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name api.mannamsquare.com;

    # SSL 인증서 설정 (메인 도메인 인증서 공유)
    include /etc/nginx/ssl/ssl-params.conf;

    # 로그 파일 (API 전용)
    access_log /var/log/nginx/api.access.log;
    error_log /var/log/nginx/api.error.log;

    # ------------------------------------------------------------------
    # Spring Boot Actuator 보안 차단 (스캔 봇 차단)
    # 헬스 체크용 /actuator/health 만 허용, 그 외(env, heapdump, configprops,
    # mappings, httpexchanges, httptrace, logfile, loggers/* 등)는 444 (no response).
    # 2026-05-04 새벽 45.45.237.107가 다양한 봇 UA로 actuator 엔드포인트 스캔 시도 사례 확인.
    # ------------------------------------------------------------------
    location = /actuator/health {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
    location ~ ^/actuator(/|$) {
        access_log /var/log/nginx/api.actuator-blocked.log;
        return 444;
    }

    # Spring Boot API로 프록시
    location / {
        # 로컬 포트 8081로 요청 전달
        proxy_pass http://localhost:8081;

        # HTTP/1.1 사용 (WebSocket 지원)
        proxy_http_version 1.1;

        # WebSocket 업그레이드 헤더 전달
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # 원본 호스트 정보 전달
        proxy_set_header Host $host;

        # 클라이언트 실제 IP 전달 (로깅 및 보안용)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # HTTPS 프로토콜 정보 전달
        proxy_set_header X-Forwarded-Proto $scheme;

        # 캐시 우회 (동적 API 응답)
        proxy_cache_bypass $http_upgrade;

        # 이미지 업로드를 위한 요청 바디 크기 제한 (50MB)
        client_max_body_size 50M;
    }
}

# ----------------------------------------------------------------------------
# [5] Frontend 앱 - GoldPet React SPA
# app.mannamsquare.com
# ----------------------------------------------------------------------------
# React 빌드 파일 서빙 (Vite 빌드 결과물)
# SPA이므로 모든 경로를 index.html로 라우팅
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name app.mannamsquare.com;

    # React 빌드 파일 디렉토리
    root /home/dev/www/mannam/goldpet/frontend/dist;
    index index.html;

    # SSL 인증서 설정 (메인 도메인 인증서 공유)
    include /etc/nginx/ssl/ssl-params.conf;

    # 로그 파일 (Frontend 전용)
    access_log /var/log/nginx/app.access.log;
    error_log /var/log/nginx/app.error.log;

    # index.html은 항상 최신 버전을 가져오도록 캐시 비활성화
    # 배포 후 새로고침 없이도 새 버전 반영
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 배포 버전 마커 — Flutter WebView가 앱 시작 시 조회해 캐시 무효화 판단.
    # build-time에 dist/version.json 으로 생성됨 (scripts/write-version.mjs).
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # iOS Universal Link — Apple App Site Association
    # frontend/public/apple-app-site-association → dist 로 복사됨
    # Content-Type 반드시 application/json (Apple 요구사항)
    location = /apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    # Android App Link — Digital Asset Links
    # frontend/public/.well-known/assetlinks.json → dist 로 복사됨
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    # React Router 지원 (클라이언트 사이드 라우팅)
    # /walk, /profile 등 모든 경로를 index.html로 연결
    location / {
        try_files $uri $uri/ /index.html;
        # SPA fallback도 index.html이므로 캐시 비활성화
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 정적 파일 강력 캐싱 (1년)
    # Vite/React가 빌드 시 파일명에 해시 추가 (예: index-abc123.js)
    # 코드 수정 시 해시가 달라져 브라우저가 자동으로 새 파일 다운로드
    # NOTE: `expires` + `add_header` 동시 사용 시 Cache-Control 헤더가 2개 발사되어
    # 일부 파서(CDN/intermediary)가 첫 번째만 읽어 `immutable` 을 놓침 → 단일 add_header 사용.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # assets 폴더 캐싱 (Vite 빌드 결과물)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Gzip 압축 활성화 (전송 속도 향상)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml+rss application/json;
}

# ----------------------------------------------------------------------------
# [6] Admin 패널 - GoldPet 관리자 React SPA
# admin.mannamsquare.com
# ----------------------------------------------------------------------------
# React + Vite로 구현된 GoldPet 관리자 페이지
# BrowserRouter 사용하므로 SPA 라우팅 지원 필요
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name admin.mannamsquare.com;

    # Admin React 빌드 파일 디렉토리
    root /home/dev/www/mannam/goldpet/admin/dist;
    index index.html;

    # SSL 인증서 설정 (메인 도메인 인증서 공유)
    include /etc/nginx/ssl/ssl-params.conf;

    # 로그 파일 (Admin 전용)
    access_log /var/log/nginx/admin.access.log;
    error_log /var/log/nginx/admin.error.log;

    # ------------------------------------------------------------
    # Sprint 2 BLOCKER #7 — IP allowlist 적용 위치
    # ------------------------------------------------------------
    # 운영자/사무실 IP 화이트리스트로 admin 접근 제한.
    # snippet 파일에서 실제 IP 를 채운 뒤 아래 include 를 활성화:
    #
    #   include /etc/nginx/snippets/admin-ip-allowlist.conf;
    #
    # snippet 위치: deploy-dev/nginx/snippets/admin-ip-allowlist.conf
    # nginx -t 로 syntax 검증 후 systemctl reload nginx.
    # ------------------------------------------------------------

    # index.html은 항상 최신 버전을 가져오도록 캐시 비활성화
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # React Router 지원 (클라이언트 사이드 라우팅)
    # /users, /posts 등 모든 관리자 경로를 index.html로 연결
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 정적 파일 강력 캐싱 (1년)
    # NOTE: `expires` + `add_header` 동시 사용 시 Cache-Control 헤더가 2개 발사되는 이슈
    # → 단일 add_header 로 통일.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # assets 폴더 캐싱
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Gzip 압축 활성화
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml+rss application/json;
}

# ----------------------------------------------------------------------------
# [7] Mobile Web - 정적 HTML 페이지
# m.mannamsquare.com
# ----------------------------------------------------------------------------
# 모바일 웹 (정적 HTML)
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name m.mannamsquare.com;

    # 정적 HTML 파일 디렉토리
    root /home/dev/www/mannam/html;
    index index.html;

    # SSL 인증서 설정 (메인 도메인 인증서 공유)
    include /etc/nginx/ssl/ssl-params.conf;

    # 정적 파일 서빙 (SPA 아님)
    location / {
        try_files $uri $uri/ =404;
    }
}

# ----------------------------------------------------------------------------
# [8] S3/MinIO Storage - 파일 스토리지 (S3 API)
# s3.mannamsquare.com
# ----------------------------------------------------------------------------
# MinIO Object Storage S3 API 프록시
# 업로드된 이미지, 파일 등 정적 파일 서빙
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name s3.mannamsquare.com;

    # SSL 인증서 설정 (메인 도메인 인증서 공유)
    include /etc/nginx/ssl/ssl-params.conf;

    # 로그 파일 (S3 전용)
    access_log /var/log/nginx/s3.access.log;
    error_log /var/log/nginx/s3.error.log;

    # MinIO S3 API로 프록시 (포트 9000)
    location / {
        proxy_pass http://localhost:9000;
        proxy_http_version 1.1;
        # Host 헤더를 서명 시점의 내부 호스트로 되돌려 SigV4 presigned URL 검증 성공시킨다.
        # 백엔드는 localhost:9000으로 서명하고 URL만 s3.mannamsquare.com으로 치환하므로,
        # 여기서 $host를 그대로 전달하면 host 불일치로 SignatureDoesNotMatch 403이 난다.
        proxy_set_header Host localhost:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 파일 다운로드를 위한 큰 버퍼
        proxy_buffering off;
        proxy_request_buffering off;

        # 대용량 파일 업로드 지원 (100MB)
        client_max_body_size 100M;

        # 이미지 캐싱 (1년 + immutable)
        # FileService 가 S3 PUT 시 `Cache-Control: public, max-age=31536000, immutable` 메타를
        # 붙이지만 nginx 가 `expires` + `add_header` 조합으로 Cache-Control 을 2번 발사하면
        # 일부 CDN/파서가 첫 헤더만 읽어 `immutable` 을 놓침. upstream 헤더도 숨기고 단일
        # add_header 로 통일해 의도를 일치시킨다. variant 파일(_thumb/_medium/_viewer)은 불변이고
        # 원본도 UUID 파일명이라 재사용 없음 → immutable 안전.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}

# ----------------------------------------------------------------------------
# [9] MinIO Console - 관리자 웹 UI
# minio.mannamsquare.com
# ----------------------------------------------------------------------------
# MinIO 웹 콘솔 (버킷 관리, 파일 업로드 등)
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name minio.mannamsquare.com;

    # SSL 인증서 설정 (메인 도메인 인증서 공유)
    include /etc/nginx/ssl/ssl-params.conf;

    # 로그 파일 (MinIO Console 전용)
    access_log /var/log/nginx/minio.access.log;
    error_log /var/log/nginx/minio.error.log;

    # MinIO Console로 프록시 (포트 9001)
    location / {
        proxy_pass http://localhost:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 지원 (Console 실시간 업데이트)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 파일 업로드 지원 (100MB)
        client_max_body_size 100M;
    }
}
