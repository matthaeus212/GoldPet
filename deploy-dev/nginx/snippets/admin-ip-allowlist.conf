# Admin Panel IP Allowlist (Sprint 2 BLOCKER #7)
#
# 이 파일은 `admin.mannamsquare.com` 서버 블록 안의 `location /` 직전에 `include` 해서 사용.
#
# 적용 방법 (mannam.conf admin server 블록 안):
#   include /etc/nginx/snippets/admin-ip-allowlist.conf;
#
# 적용 전 필수 작업:
#   1. 아래 placeholder IP 를 실제 운영자/사무실 IP 로 교체.
#   2. VPN/사내망 사용 시 그 대역도 추가.
#   3. nginx -t 로 syntax 검증 후 systemctl reload nginx.
#
# 적용 후 검증:
#   - 사내 IP 에서 admin.mannamsquare.com 접근 시 200
#   - 외부 IP 에서 접근 시 403
#
# 변경 이력:
#   2026-05-26: Sprint 2 BLOCKER #7 — placeholder 작성 (실제 IP 미주입, 운영자 채움)

# ----------------------------------------------------------------------------
# 운영자 IP / 사무실 대역 — TODO: 실제 IP 로 교체 필수
# ----------------------------------------------------------------------------

# 예시 1 — 단일 사무실 IP
# allow 203.0.113.42;

# 예시 2 — 사무실 /24 대역
# allow 203.0.113.0/24;

# 예시 3 — VPN 대역
# allow 10.0.0.0/8;

# 예시 4 — localhost (dev 서버 SSH 터널)
# allow 127.0.0.1;

# 모든 외부 차단
# deny all;

# ----------------------------------------------------------------------------
# 활성화 전 — 위 allow/deny 주석 해제 후 운영자 IP 입력
# 비활성 상태에서는 nginx 가 본 파일을 빈 본문으로 처리 → 모든 IP 허용 (기존 동작 유지)
# ----------------------------------------------------------------------------
