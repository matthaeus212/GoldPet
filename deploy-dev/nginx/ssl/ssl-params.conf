# ============================================================================
# SSL Certificate Configuration
# mannamsquare.com 메인 도메인 인증서 설정
# ============================================================================
# 
# 사용 위치: /etc/nginx/ssl/ssl-params.conf
# 
# 메인 도메인 인증서를 공유하는 서브도메인:
# - api.mannamsquare.com
# - app.mannamsquare.com
# - admin.mannamsquare.com
# - m.mannamsquare.com
# 
# ⚠️ 제외: jenkins.mannamsquare.com (별도 인증서 사용)
#    Jenkins는 /etc/letsencrypt/live/jenkins.mannamsquare.com/ 경로의
#    전용 인증서를 사용하며, 설정은 jenkins.mannamsquare.com 파일 참조
# ============================================================================

ssl_certificate     /etc/letsencrypt/live/mannamsquare.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/mannamsquare.com/privkey.pem;
include /etc/letsencrypt/options-ssl-nginx.conf;
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
