# GoldPet nginx 추가 jail (2026-05-04)
#
# 컨텍스트:
#  - jail.local 은 jail.d/* 보다 나중에 로드돼 동일 섹션이면 덮어씀.
#    -> jail.local 의 [nginx-botsearch] (logpath=error_log) 와 충돌 회피 위해
#       built-in [nginx-botsearch] 대신 고유 이름 [goldpet-nginx-bot] 을 쓰고
#       filter 만 built-in 을 재사용한다.
#  - backend=auto 가 systemd journal 을 우선 선택해 파일 모니터링이 빠질 수 있어
#    backend=polling 을 명시.
#  - ignoreip 에 서버 자체 공인 IP (101.250.201.36) 포함:
#    loopback HTTPS 테스트(curl https://api.mannamsquare.com) 시 self-ban 사고 방지.

[nginx-actuator-scan]
enabled  = true
port     = http,https
filter   = nginx-actuator-scan
logpath  = /var/log/nginx/api.actuator-blocked.log
backend  = polling
maxretry = 1
findtime = 86400
bantime  = 86400
ignoreip = 127.0.0.1/8 ::1 101.250.201.36

[goldpet-nginx-bot]
enabled  = true
port     = http,https
filter   = nginx-botsearch
logpath  = /var/log/nginx/*access.log
backend  = polling
maxretry = 2
findtime = 600
bantime  = 3600
ignoreip = 127.0.0.1/8 ::1 101.250.201.36
