          format: int64
        breedId:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
        gender:
          type: string
        birthDate:
          type: string
          format: date
          nullable: true
        mainPhotoUrl:
          type: string
          nullable: true

    CreatePetRequest:
      type: object
      required: [name, speciesId]
