<!DOCTYPE html>
<html lang="ko">
<head>
    <title>골든 펫</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">

    <meta name="Description" content="골든 펫">
    <meta name="Keywords" content="골든 펫">
    <meta name="Author" content="골든 펫">
    <meta name="robots" content="noindex">
    <meta property="og:title" content="골든 펫">
    <meta property="og:description" content="골든 펫">
    <meta property="og:image" content="">
    <meta property="og:site_name" content="골든 펫">
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
</head>
<body>
<div id="wrap">
    <!--header-->
	<header id="header">
	    <div class="header_wrap">
	        <a href=""><img src="../assets/images/layout/logo.svg" alt="골든 펫 로고"></a>
	        <ul class="header_util">
	            <li><button type="button"><img src="../assets/images/layout/header_icon01.svg" alt="G아이콘"></button></li>
	            <li><button type="button"><img src="../assets/images/layout/header_icon02.svg" alt="알림"></button></li>
	            <li><button type="button"><img src="../assets/images/layout/header_icon03.svg" alt="프로필"></button></li>
	        </ul>
	    </div>
	</header>
	<!--//header-->
    <div id="walkContainer">
	    <div class="talk_wrap">
	        <p>
	            골드펫과 함께 <br>
	            즐거운 산책을 즐겨보세요.
	        </p>
	        <button type="button"><img src="../assets/images/common/pin_icon.svg" alt="지도 마커">서울 강남구</button>
	    </div>

	    <!--상단 카드-->
	    <div class="walk_tit">
	        <div class="walk_card">
	            <p>오늘</p>
	            <div class="card_detail">
	                <dl>
	                    <dt>산책 거리(km)</dt>
	                    <dd>1.25</dd>
	                </dl>
	                <dl>
	                    <dt>소요 칼로리(Kcal)</dt>
	                    <dd>1,250</dd>
	                </dl>
	            </div>
	        </div>
	        <button type="button" class="walk_go_link">지금 바로 산책을 시작해볼까요?</button>
	    </div>

	    <div class="record_wrap">
	        <ul class="record_tab">
	            <li><button type="button" class="active">우리의 산책 기록</button></li>
	            <li><button type="button">베스트 랭킹</button></li>
	        </ul>

	        <!--상세-->
	        <div class="record_detail">
	            <p>산책거리</p>
	            <div class="detail_tab">
	                <button type="button" class="active">일</button>
	                <button type="button">주</button>
	                <button type="button">월</button>
	            </div>
	        </div>
	    </div>
	</div>
	    
    <!--bottom nav-->
	<!--현재 페이지 button에 active 추가-->
	<div id="bottomNav">
	    <ul>
	        <li><button type="button" class="b_nav01 active">친구찾기</button></li>
	        <li><button type="button" class="b_nav02">채팅</button></li>
	        <li class="ai_btn"><button type="button"><img src="../assets/images/layout/b_fix_center_icon.png" alt="AI"></button></li>
	        <li><button type="button" class="b_nav03">산책</button></li>
	        <li><button type="button" class="b_nav04">커뮤니티</button></li>
	    </ul>
	</div>
	<!--//bottom nav-->
</div>
<script src="../assets/javascripts/plugin.js"></script>
<script src="../assets/javascripts/design_common.js"></script>
</body>
</html>
