<!DOCTYPE html>
<html lang="ko">
<head>
    <title>골든 펫</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">

    <meta name="Description" content="골든 펫">
    <meta name="Keywords" content="골든 펫">
    <meta name="Author" content="골든 펫">
    <meta name="robots" content="noindex">
    <meta property="og:title" content="골든 펫">
    <meta property="og:description" content="골든 펫">
    <meta property="og:image" content="">
    <meta property="og:site_name" content="골든 펫">
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
</head>
<body>
<div id="wrap">
    <!--header-->
	<header id="header">
	    <div class="header_wrap">
	        <a href=""><img src="../assets/images/layout/logo.svg" alt="골든 펫 로고"></a>
	        <ul class="header_util">
	            <li><button type="button"><img src="../assets/images/layout/header_icon01.svg" alt="G아이콘"></button></li>
	            <li><button type="button"><img src="../assets/images/layout/header_icon02.svg" alt="알림"></button></li>
	            <li><button type="button"><img src="../assets/images/layout/header_icon03.svg" alt="프로필"></button></li>
	        </ul>
	    </div>
	</header>
	<!--//header-->
    <div id="profileContainer">
	    <div class="talk_wrap">
	        <p>
	            반려동물과 함께하는 <br>
	            행복한 일상을 같이 공유하고 싶어요
	        </p>
	        <button type="button"><img src="../assets/images/common/pin_icon.svg" alt="지도 마커">서울 강남구</button>
	    </div>
	    
	    <div class="group_tab">
	        <button type="button">반려인</button>
	        <button type="button" class="active">반려동물</button>
	    </div>
	    
	    <div class="profile_info_wrap">
	        <div class="profile_name_info">
	            <div class="couple_img">
	                
	                <!--
	                AI 프로필 생성하기 버튼 노출은
	                profile_img_wrap 슬라이더 부분 전체 삭제
	                -->
	                
	                <div class="profile_img_wrap">
	                    <div class="swiper-wrapper">
	                        <div class="swiper-slide"><img src="../assets/images/main/main_slide_img01.png" class="pet_img" alt=""></div>
	                        <div class="swiper-slide"><img src="../assets/images/main/main_slide_butler01.jpg" class="pet_img" alt=""></div>
	                        <div class="swiper-slide"><img src="../assets/images/main/main_slide_img01.png" class="pet_img" alt=""></div>
	                    </div>
	                    <div class="swiper-profile-prev"></div>
	                    <div class="swiper-profile-next"></div>
	                    
	                    <!-- ai 프로필 생성 -->
	                    <!--<div class="ai_generation_wrap">
	                        <button type="button"><img src="../assets/images/common/ai_profile_icon.svg" alt="">프로필 생성하기</button>
	                    </div>-->
	                    <!-- //ai 프로필 생성 -->
	                </div>
	                <!--사진 하단 오른쪽 펫 이미지 등록된 이미지 없으면 img src만 삭제-->
	                <div class="butler_img pet_img">
	                    <img src="../assets/images/main/main_slide_img01.png" alt="펫 이미지">
	                </div>
	            </div>
	            <strong class="name_txt">망고</strong>
	            <div class="count_wrap">
	                <dl>
	                    <dt>매칭</dt>
	                    <dd>128</dd>
	                </dl>
	                <div></div>
	                <dl>
	                    <dt>좋아요</dt>
	                    <dd>2.4K</dd>
	                </dl>
	                <div></div>
	                <dl>
	                    <dt>친구</dt>
	                    <dd>48</dd>
	                </dl>
	            </div>
	        </div>
	        
	        <!--box_wrap에 pink_color,purple_color,blue_color,green_color class로 색상 조절-->
	        <div class="profile_info_box">
	            <strong>기본 정보</strong>
	            <div class="box_wrap pink_color">
	                <dl>
	                    <dt>나이</dt>
	                    <dd>3세</dd>
	                </dl>
	                <dl>
	                    <dt>성별</dt>
	                    <dd>여아</dd>
	                </dl>
	                <dl>
	                    <dt>중성화</dt>
	                    <dd>완료</dd>
	                </dl>
	                <dl>
	                    <dt>품종</dt>
	                    <dd>브리티시 쇼트헤어</dd>
	                </dl>
	            </div>

	            <strong>성향</strong>
	            <div class="box_wrap purple_color">
	                <dl>
	                    <dt>활동성</dt>
	                    <dd>매우 활발함</dd>
	                </dl>
	                <dl>
	                    <dt>친화력</dt>
	                    <dd>매우 좋음</dd>
	                </dl>
	                <dl>
	                    <dt>훈련도</dt>
	                    <dd>우수함(전문교육수료)</dd>
	                </dl>
	                <dl>
	                    <dt>짖음</dt>
	                    <dd>거의 없음</dd>
	                </dl>
	                <dl class="full_w">
	                    <dt>특이사항</dt>
	                    <dd>산책을 매우 좋아하고 다른 강아지와도 잘 어울려요. 특히 공놀이를 너무나 좋아해서 피곤할 정도! ; )</dd>
	                </dl>
	            </div>

	            <strong>알러지 정보</strong>
	            <div class="box_wrap blue_color">
	                <dl>
	                    <dt>견과류</dt>
	                    <dd>주의 필요</dd>
	                </dl>
	                <dl>
	                    <dt>갑각류</dt>
	                    <dd>안전</dd>
	                </dl>
	                <dl>
	                    <dt>달걀&육류</dt>
	                    <dd>안정</dd>
	                </dl>
	                <dl>
	                    <dt>기타</dt>
	                    <dd>없음</dd>
	                </dl>
	            </div>

	            <strong>관심사</strong>
	            <div class="box_wrap green_color">
	                <dl>
	                    <dt>장난감 놀이</dt>
	                    <dd>매우 좋아함</dd>
	                </dl>
	                <dl>
	                    <dt>산책</dt>
	                    <dd>매우 좋아함</dd>
	                </dl>
	                <dl>
	                    <dt>수명</dt>
	                    <dd>보통</dd>
	                </dl>
	                <dl>
	                    <dt>쓰다듬기</dt>
	                    <dd>매우 좋아함</dd>
	                </dl>
	            </div>
	        </div>
	        <div class="check_wrap">
	            <div class="check_box">
	                <input type="checkbox" id="alram">
	                <label for="alram">알림설정</label>
	            </div>
	            <a href="" class="white_link">약관</a>
	            <button type="button" class="submit_btn">수정하기</button>
	        </div>
	    </div>
	</div>
	    
    <!--bottom nav-->
	<!--현재 페이지 button에 active 추가-->
	<div id="bottomNav">
	    <ul>
	        <li><button type="button" class="b_nav01 active">친구찾기</button></li>
	        <li><button type="button" class="b_nav02">채팅</button></li>
	        <li class="ai_btn"><button type="button"><img src="../assets/images/layout/b_fix_center_icon.png" alt="AI"></button></li>
	        <li><button type="button" class="b_nav03">산책</button></li>
	        <li><button type="button" class="b_nav04">커뮤니티</button></li>
	    </ul>
	</div>
	<!--//bottom nav-->
</div>
<script src="../assets/javascripts/plugin.js"></script>
<script src="../assets/javascripts/design_common.js"></script>
</body>
</html>
