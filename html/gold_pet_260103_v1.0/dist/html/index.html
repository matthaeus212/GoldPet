<!DOCTYPE html>
<html lang="ko">
<head>
    <title>골든 펫</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">

    <meta name="Description" content="골든 펫">
    <meta name="Keywords" content="골든 펫">
    <meta name="Author" content="골든 펫">
    <meta name="robots" content="noindex">
    <meta property="og:title" content="골든 펫">
    <meta property="og:description" content="골든 펫">
    <meta property="og:image" content="">
    <meta property="og:site_name" content="골든 펫">
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
</head>
<body>
<div id="wrap">
    <!--header-->
	<header id="header">
	    <div class="header_wrap">
	        <a href=""><img src="../assets/images/layout/logo.svg" alt="골든 펫 로고"></a>
	        <ul class="header_util">
	            <li><button type="button"><img src="../assets/images/layout/header_icon01.svg" alt="G아이콘"></button></li>
	            <li><button type="button"><img src="../assets/images/layout/header_icon02.svg" alt="알림"></button></li>
	            <li><button type="button"><img src="../assets/images/layout/header_icon03.svg" alt="프로필"></button></li>
	        </ul>
	    </div>
	</header>
	<!--//header-->
    <div id="mainContainer">
	    <div class="talk_wrap">
	        <p>
	            나에게 호감 있는 친구들이에요. <br>
	            ‘조하멍' 선택하고 대화 나눠보세요.
	        </p>
	        <button type="button"><img src="../assets/images/common/pin_icon.svg" alt="지도 마커">서울 강남구</button>
	    </div>
	    <div class="main_slide">
	        <div class="swiper-wrapper">
	            <div class="swiper-slide">
	                <div class="img_wrap">
	                    <!--사진 상단 왼쪽 아이콘-->
	                    <img src="../assets/images/main/main_slide_icon01.svg" data-swiper-parallax="-500" class="icon_img" alt="">
	                    <!--메인 반려동물 이미지-->
	                    <div class="main_slide_inside">
	                        <div class="swiper-wrapper">
	                            <div class="swiper-slide"><img src="../assets/images/main/main_slide_img01.png" class="pet_img" alt=""></div>
	                            <div class="swiper-slide"><img src="../assets/images/main/main_slide_img01.png" class="pet_img" alt=""></div>
	                            <div class="swiper-slide"><img src="../assets/images/main/main_slide_img01.png" class="pet_img" alt=""></div>
	                        </div>
	                        <div class="swiper-inside-prev"></div>
	                        <div class="swiper-inside-next"></div>
	                    </div>
	                    <!--사진 하단 오른쪽 집사 이미지-->
	                    <div class="butler_img"  data-swiper-parallax="-400">
	                        <img src="../assets/images/main/main_slide_butler01.jpg" alt="집사 이미지">
	                    </div>
	                </div>
	                <div class="txt_wrap" data-swiper-parallax="-200">
	                    <!--남자의 경우 img src ../assets/images/main/man_icon.svg -->
	                    <h2>멍텅구리 <img src="../assets/images/main/woman_icon.svg" alt="여자 icon"></h2>
	                    <!-- neutering_on 붙이면 중성화 ok 노출 -->
	                    <p>중성화 OK</p>
	                </div>
	                <div class="pet_detail">
	                    <p  data-swiper-parallax="-300">
	                        5개월 ∙ 코숏 치즈 <br>
	                        서울 강남구 ∙ 1km 이내
	                    </p>
	                    <!-- class 없으면 default, active 추가 하면 좋아요-->
	                    <div class="like_wrap" data-swiper-parallax="-200">
	                        <button type="button">싫어요</button>
	                        <button type="button" class="active">좋아요</button>
	                    </div>
	                </div>
	            </div>
	            <div class="swiper-slide">
	                <div class="img_wrap">
	                    <img src="../assets/images/main/main_slide_icon02.svg" data-swiper-parallax="-500" class="icon_img" alt="">
	                    <!--메인 반려동물 이미지-->
	                    <div class="main_slide_inside">
	                        <div class="swiper-wrapper">
	                            <div class="swiper-slide"><img src="../assets/images/main/main_slide_img02.png" class="pet_img" alt=""></div>
	                            <div class="swiper-slide"><img src="../assets/images/main/main_slide_img02.png" class="pet_img" alt=""></div>
	                            <div class="swiper-slide"><img src="../assets/images/main/main_slide_img02.png" class="pet_img" alt=""></div>
	                        </div>
	                        <div class="swiper-inside-prev"></div>
	                        <div class="swiper-inside-next"></div>
	                    </div>
	                    <div class="butler_img"  data-swiper-parallax="-400">
	                        <img src="../assets/images/main/main_slide_butler02.png" alt="집사 이미지">
	                    </div>
	                </div>
	                <div class="txt_wrap" data-swiper-parallax="-200">
	                    <h2>멍텅구리 <img src="../assets/images/main/woman_icon.svg" alt="여자 icon"></h2>
	                    <p class="neutering_on">중성화 OK</p>
	                </div>
	                <div class="pet_detail">
	                    <p  data-swiper-parallax="-300">
	                        5개월 ∙ 코숏 치즈 <br>
	                        서울 강남구 ∙ 1km 이내
	                    </p>
	                    <div class="like_wrap" data-swiper-parallax="-200">
	                        <button type="button">싫어요</button>
	                        <button type="button" class="active">좋아요</button>
	                    </div>
	                </div>
	            </div>
	            <div class="swiper-slide">
	                <div class="img_wrap">
	                    <img src="../assets/images/main/main_slide_icon03.svg" data-swiper-parallax="-500" class="icon_img" alt="">
	                    <!--메인 반려동물 이미지-->
	                    <div class="main_slide_inside">
	                        <div class="swiper-wrapper">
	                            <div class="swiper-slide"><img src="../assets/images/main/main_slide_img03.png" class="pet_img" alt=""></div>
	                            <div class="swiper-slide"><img src="../assets/images/main/main_slide_img03.png" class="pet_img" alt=""></div>
	                            <div class="swiper-slide"><img src="../assets/images/main/main_slide_img03.png" class="pet_img" alt=""></div>
	                        </div>
	                        <div class="swiper-inside-prev"></div>
	                        <div class="swiper-inside-next"></div>
	                    </div>
	                    <div class="butler_img"  data-swiper-parallax="-400">
	                        <img src="../assets/images/main/main_slide_butler03.png" alt="집사 이미지">
	                    </div>
	                </div>
	                <div class="txt_wrap" data-swiper-parallax="-200">
	                    <h2>멍텅구리 <img src="../assets/images/main/man_icon.svg" alt="남자 icon"></h2>
	                    <p class="neutering_on">중성화 OK</p>
	                </div>
	                <div class="pet_detail">
	                    <p  data-swiper-parallax="-300">
	                        5개월 ∙ 코숏 치즈 <br>
	                        서울 강남구 ∙ 1km 이내
	                    </p>
	                    <div class="like_wrap" data-swiper-parallax="-200">
	                        <button type="button">싫어요</button>
	                        <button type="button" class="active">좋아요</button>
	                    </div>
	                </div>
	            </div>
	        </div>
	    </div>

	    <!-- 중간 배너 -->
	    <section class="ai_profile_banner">
	        <a href="">
	            <img src="../assets/images/main/ai_banner_img.png" alt="블러 처리된 사진">
	            <div class="txt_wrap">
	                <h2>아직 AI 프로필이 없으시네요?</h2>
	                <p>멍텅구리의 다양한 모습을 지금 만나 보세요!</p>
	            </div>
	        </a>
	    </section>

	    <!-- 산책 기록-->
	    <section class="walk_wrap">
	        <div class="tit_wrap">
	            <h2>산책 기록을 남겨보세요</h2>
	            <p><img src="../assets/images/main/time_icon.svg" alt="시간 icon">3일 20시간 전</p>
	        </div>
	        <div class="txt_wrap">
	            <div class="img_wrap">
	                <img src="../assets/images/main/walk_img.jpg" alt="">
	            </div>
	            <p>
	                🐶 <span>멍텅구리</span>와 <br>
	                📍️ <span>안돌이지돌이다래미한숨바우</span>에서 <br>
	                📏 <span>3km</span> 산책하셨네요.
	            </p>
	        </div>
	    </section>
	</div>
	    
    <!--bottom nav-->
	<!--현재 페이지 button에 active 추가-->
	<div id="bottomNav">
	    <ul>
	        <li><button type="button" class="b_nav01 active">친구찾기</button></li>
	        <li><button type="button" class="b_nav02">채팅</button></li>
	        <li class="ai_btn"><button type="button"><img src="../assets/images/layout/b_fix_center_icon.png" alt="AI"></button></li>
	        <li><button type="button" class="b_nav03">산책</button></li>
	        <li><button type="button" class="b_nav04">커뮤니티</button></li>
	    </ul>
	</div>
	<!--//bottom nav-->
</div>
<script src="../assets/javascripts/plugin.js"></script>
<script src="../assets/javascripts/design_common.js"></script>
</body>
</html>
