spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:goldpet}
    username: ${DB_USER:goldpet}
    password: ${DB_PASSWORD:goldpet123}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:goldpet123}
      repositories:
        enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
          naver:
            client-id: ${NAVER_CLIENT_ID:}
            client-secret: ${NAVER_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - name
              - email
              - profile_image
            client-name: Naver
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
        #          apple:
        #            client-id: ${APPLE_CLIENT_ID}
        #            client-secret: ${APPLE_CLIENT_SECRET}
        #            client-authentication-method: client_secret_post
        #            authorization-grant-type: authorization_code
        #            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
        #            scope:
        #              - name
        #              - email
        #            client-name: Apple
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          apple:
            client-id: YOUR_APPLE_CLIENT_ID
            client-secret: YOUR_APPLE_CLIENT_SECRET
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - name
              - email
            client-name: Apple

server:
  port: 8081
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"

app:
  # community-author-profile-gallery §4-1: Bucket4j-redis rate limit for public profile endpoints.
  # Disable in tests via `application-test.yml` to keep integration tests deterministic.
  rate-limit:
    user-profile:
      enabled: ${USER_PROFILE_RATE_LIMIT_ENABLED:true}
      viewer-per-minute: ${USER_PROFILE_RATE_LIMIT_VIEWER_PER_MINUTE:60}
      ip-per-minute: ${USER_PROFILE_RATE_LIMIT_IP_PER_MINUTE:120}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:your_very_secure_and_long_jwt_secret_key_for_goldpet_application_2024}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 2592000000 # 30 days

S3_ENDPOINT: ${MINIO_ENDPOINT:http://localhost:9100}
S3_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9100}
S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:goldpet-s3-access-key}
S3_SECRET_KEY: ${MINIO_SECRET_KEY:goldpet-s3-secret-key}
S3_PUBLIC_BUCKET_NAME: ${MINIO_PUBLIC_BUCKET:goldpet-public}
S3_PRIVATE_BUCKET_NAME: ${MINIO_PRIVATE_BUCKET:goldpet-private}

# Google Maps Platform API
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
