<body>
<div id="wrap">
    <!--header-->
	<header id="header">
	    <div class="header_wrap">
	        <a href=""><img src="../assets/images/layout/logo.svg" alt="골든 펫 로고"></a>
	        <ul class="header_util">
	            <li><button type="button"><img src="../assets/images/layout/header_icon01.svg" alt="G아이콘"></button></li>
	            <li><button type="button"><img src="../assets/images/layout/header_icon02.svg" alt="알림"></button></li>
	            <li><button type="button"><img src="../assets/images/layout/header_icon03.svg" alt="프로필"></button></li>
	        </ul>
	    </div>
	</header>
	<!--//header-->
    <div id="chatOne">

	        <button type="button">대화요청</button>
	    </div>
	    <ul class="chat_list">
	        <li>
	            <button type="button">
	                <div class="profile_img"><img src="../assets/images/main/main_slide_butler01.jpg" alt=""></div>
	                <div class="txt_wrap">
	                    <strong>방구석여포</strong>
	                    <p>그럼 내일 제가 나가면서 채팅할게요 :) 그럼 내일 제가 나가면서 채팅할게요 :)</p>
	                </div>
	                <div class="day_txt">
	                    <p class="count_num">99</p>
	                    <p class="last_day">1시간 전</p>
	                </div>
	            </button>
	        </li>
	        <li>
	            <button type="button">
	                <div class="profile_img"><img src="../assets/images/main/main_slide_butler01.jpg" alt=""></div>
	                <div class="txt_wrap">
	                    <strong>방구석여포</strong>
	                    <p>그럼 내일 제가 나가면서 채팅할게요 :) 그럼 내일 제가 나가면서 채팅할게요 :)</p>
	                </div>
	                <div class="day_txt">
	                    <p class="count_num">1</p>
	                    <p class="last_day">어제</p>
	                </div>
	            </button>
	        </li>
	        <li>
	            <button type="button">
	                <div class="profile_img"><img src="../assets/images/main/main_slide_butler01.jpg" alt=""></div>
	                <div class="txt_wrap">
	                    <strong>방구석여포</strong>
	                    <p>그럼 내일 제가 나가면서 채팅할게요 :) 그럼 내일 제가 나가면서 채팅할게요 :)</p>
	                </div>
	                <div class="day_txt">
	                    <p class="count_num">100</p>
	                    <p class="last_day">한달 전</p>
	                </div>
	            </button>
	        </li>
	    </ul>
	</div>
	    
    <!--bottom nav-->
	<div id="bottomNav">
	    <ul>
	        <li><button type="button"><img src="../assets/images/layout/b_fix_icon01.svg" alt="">친구찾기</button></li>

	        <li class="ai_btn"><button type="button"><img src="../assets/images/layout/b_fix_center_icon.png" alt="AI"></button></li>
	        <li><button type="button"><img src="../assets/images/layout/b_fix_icon03.svg" alt="">산책</button></li>
	        <li><button type="button"><img src="../assets/images/layout/b_fix_icon04.svg" alt="">커뮤니티</button></li>
