# -----------------------------
# PostgreSQL Configuration File
# Optimized for: 32GB RAM, 24 Threads, SSD
# -----------------------------

# CONNECTION
listen_addresses = '*'
max_connections = 200

# MEMORY (Based on 32GB System RAM)
shared_buffers = 8GB                  # 25% of RAM
effective_cache_size = 24GB           # 75% of RAM
work_mem = 16MB                       # Local memory for sorts/joins per operation
maintenance_work_mem = 2GB            # Maintenance tasks (VACUUM, CREATE INDEX)

# CHECKPOINTS & WAL
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
wal_buffers = 16MB

# PARALLEL QUERIES (Utilize 24 vCPUs)
max_worker_processes = 24
max_parallel_workers_per_gather = 4
max_parallel_workers = 24
max_parallel_maintenance_workers = 4

# OPTIMIZER (SSD Tuning)
random_page_cost = 1.1                # Assuming SSD
effective_io_concurrency = 200        # SSD concurrent I/O capabilities

# LOGGING
log_timezone = 'Asia/Seoul'
timezone = 'Asia/Seoul'

# POSTGIS (If using specific extensions loaded via shared_preload_libraries)
# shared_preload_libraries = 'pg_stat_statements' # Optional recommended
